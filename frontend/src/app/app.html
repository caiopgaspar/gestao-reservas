<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-auto px-0" style="background-color: #f4f4f4">
      <div id="sidebar" class="collapse collapse-horizontal show border-end"
           [class.sidebar-expanded]="sidebarExpanded">
        <div id="sidebar-nav" class="d-flex flex-column vh-100">

          <!-- Botão Toggle -->
          <div class="border-bottom text-white d-flex align-items-center" style="background-color: #5e87b0; max-height: 46px">
            <button class="btn btn-sm me-2" (click)="toggleSidebar()">
              <i class="bi bi-list fs-3"></i>
            </button>
            <span *ngIf="sidebarExpanded" class="fw-bold">Menu</span>
          </div>

          <!-- Itens do Menu -->
          <ul class="nav nav-pills flex-column mb-auto flex-grow-1">
            <li class="nav-item">
              <a routerLink="/index" routerLinkActive="active"
                 class="nav-link text-dark d-flex align-items-center">
                <i class="bi bi-house fs-5"></i>
                <span *ngIf="sidebarExpanded" class="ms-2">Home</span>
              </a>
            </li>
            <li class="nav-item">
              <a routerLink="/tipo-recurso" routerLinkActive="active"
                 class="nav-link text-dark d-flex align-items-center">
                <i class="bi bi-collection fs-5"></i>
                <span *ngIf="sidebarExpanded" class="ms-2">Tipos de Recurso</span>
              </a>
            </li>
            <li class="nav-item">
              <a routerLink="/recurso" routerLinkActive="active"
                 class="nav-link text-dark d-flex align-items-center">
                <i class="bi bi-cast fs-5"></i>
                <span *ngIf="sidebarExpanded" class="ms-2">Recurso</span>
              </a>
            </li>
            <li class="nav-item">
              <a routerLink="/reserva" routerLinkActive="active"
                 class="nav-link text-dark d-flex align-items-center">
                <i class="bi bi-calendar-check fs-5"></i>
                <span *ngIf="sidebarExpanded" class="ms-2">Reserva</span>
              </a>
            </li>
            <li class="nav-item">
              <a routerLink="/usuario" routerLinkActive="active"
                 class="nav-link text-dark d-flex align-items-center">
                <i class="bi bi-person fs-5"></i>
                <span *ngIf="sidebarExpanded" class="ms-2">Reserva</span>
              </a>
            </li>
          </ul>

          <!-- Footer da Sidebar -->
          <div class="p-3 border-top" *ngIf="sidebarExpanded">
            <small class="text-muted">Gestão de Reservas</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Conteúdo Principal -->
    <main class="col ps-0">
      <!-- Header -->
      <header class="text-white py-2 px-3" style="background-color: #5e87b0">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm btn-light me-2 d-md-none" (click)="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
          <h4 class="mb-0">{{ title }}</h4>
        </div>
      </header>

      <div class="p-3">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
