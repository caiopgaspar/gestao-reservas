<div class="container-fluid mt-4">
  <div class="row">
    <!-- Card de Relatório de Recursos -->
    <div class="col-md-6 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">
            <i class="bi bi-building me-2"></i>
            Relatório de Recursos
          </h5>
        </div>
        <div class="card-body">
          <p class="card-text text-muted">
            Gera uma lista completa de todos os recursos cadastrados no sistema,
            incluindo código, nome, tipo, localização e capacidade.
          </p>
          <button
            class="btn btn-primary w-100"
            (click)="gerarRelatorioRecursos()"
            [disabled]="carregando">
            <span *ngIf="carregando" class="spinner-border spinner-border-sm me-2"></span>
            <i class="bi bi-file-pdf me-2"></i>
            Gerar PDF
          </button>
        </div>
      </div>
    </div>

    <!-- Card de Relatório de Reservas -->
    <div class="col-md-6 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">
            <i class="bi bi-calendar-event me-2"></i>
            Relatório de Reservas
          </h5>
        </div>
        <div class="card-body">
          <p class="card-text text-muted">
            Gera um relatório de reservas com filtros personalizados.
          </p>

          <!-- Filtros -->
          <div class="mb-3">
            <label for="recursoId" class="form-label">Recurso</label>
            <select id="recursoId" class="form-select" [(ngModel)]="filtros.recursoId">
              <option [value]="undefined">Todos os recursos</option>
              <option *ngFor="let recurso of recursos" [value]="recurso.id">
                {{ recurso.codigoIdentificacao }} - {{ recurso.nome }}
              </option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="dataInicio" class="form-label">Data Início</label>
              <input type="date" id="dataInicio" class="form-control" [(ngModel)]="filtros.dataInicio">
            </div>
            <div class="col-md-6 mb-3">
              <label for="dataFim" class="form-label">Data Fim</label>
              <input type="date" id="dataFim" class="form-control" [(ngModel)]="filtros.dataFim">
            </div>
          </div>

          <div class="d-flex gap-2">
            <button
              class="btn btn-success flex-grow-1"
              (click)="gerarRelatorioReservas()"
              [disabled]="carregando">
              <span *ngIf="carregando" class="spinner-border spinner-border-sm me-2"></span>
              <i class="bi bi-file-pdf me-2"></i>
              Gerar PDF
            </button>
            <button
              class="btn btn-outline-secondary"
              (click)="limparFiltros()"
              [disabled]="carregando">
              <i class="bi bi-eraser"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
