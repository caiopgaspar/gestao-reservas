<div class="container-fluid mt-3 border-0">

  <!-- CARD DE CADASTRO/EDIÇÃO -->
  <div class="card border-0">

    <form [formGroup]="tipoRecursoForm" (ngSubmit)="onSubmit()" *ngIf="!carregando || !editando">

      <div class="card-header bg-transparent border-0">

        <div class="d-flex justify-content-between align-items-center">

          <h5 class="card-title mb-0">
            <i class="bi" [class.bi-plus-circle]="!editando" [class.bi-pencil]="editando"></i>
            {{ editando ? 'Editar Tipo de Recurso' : 'Cadastrar Novo Tipo de Recurso' }}
          </h5>

          <div class="d-flex gap-2">

            <button
              type="submit"
              class="btn btn-outline-secondary btn-sm">
              <span *ngIf="!salvando">
                <i class="bi bi-floppy2-fill me-1"></i>
                {{ editando ? 'Atualizar' : 'Cadastrar' }}
              </span>
              <span *ngIf="salvando">
                <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                {{ editando ? 'Atualizando...' : 'Salvando...' }}
              </span>
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="cancelar()">
              <i class="bi bi-ban me-1"></i>
              Cancelar
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="cancelar()">
              <i class="bi bi-x-circle-fill me-1"></i> Fechar
            </button>

          </div>
        </div>
      </div>

      <div class="card-body">

        <!-- Loading ao carregar dados para edição -->
        <div *ngIf="carregando && editando" class="alert alert-info mb-4">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>
          Carregando dados do tipo de recurso...
        </div>

        <div class="mt-0 pt-3 border-top">

          <!-- Nome -->
          <div class="row g-2 align-items-center mt-3">
            <div class="col-1 text-end">
              <label for="nome" class="form-label mb-0">
                Nome: <span class="text-danger">*</span>
              </label>
            </div>

            <div class="col-9">
              <input
                type="text"
                id="nome"
                formControlName="nome"
                class="form-control form-control-sm"
                style="max-width: 70%"
                [class.is-invalid]="tipoRecursoForm.get('nome')?.invalid && tipoRecursoForm.get('nome')?.touched"
                placeholder="Ex: Equipamento, Sala, Veículo">

              <div class="invalid-feedback" *ngIf="tipoRecursoForm.get('nome')?.errors?.['required']">
                O nome é obrigatório
              </div>
              <div class="invalid-feedback" *ngIf="tipoRecursoForm.get('nome')?.errors?.['minlength']">
                O nome deve ter pelo menos 2 caracteres
              </div>
            </div>
          </div>

          <!-- Descrição -->
          <div class="row g-2 align-items-center mt-0">
            <div class="col-1 text-end">
              <label for="descricao" class="form-label mb-0">
                Descrição:
              </label>
            </div>

            <div class="col-9">
              <input
                type="text"
                id="descricao"
                formControlName="descricao"
                class="form-control form-control-sm"
                style="max-width: 70%"
                placeholder="Ex: Equipamentos de escritório, Salas de reunião, Veículos oficiais">
            </div>

          </div>

        </div>

      </div>

    </form>

    <div *ngIf="carregando && editando" class="card-body">
      <div class="alert alert-info">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Carregando dados do tipo de recurso...
      </div>
    </div>

  </div>
</div>
